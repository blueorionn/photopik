[project]
name = "photopik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swadhin", email = "168361244+blueorionn@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "psycopg2-binary>=2.9.13",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.10.0",
]
