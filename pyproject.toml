[project]
name = "photopik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swadhin", email = "168361244+blueorionn@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
photopik = "photopik:main"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
]
