[project]
name = "photopik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swadhin", email = "168361244+blueorionn@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask[async]",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.1.5",
    "pillow>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "pydantic>=2.14.1",
]

[project.optional-dependencies]
local = [
    "torch>=2.4.0",
    "diffusers>=0.41.0",
    "transformers>=5.20.1",
    "accelerate>=1.15.0",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.33.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "local", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=8.0.0",
]
